<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Epic Travel - Your gateway to unforgettable travel experiences.">
    <title>Epic Spirit</title>
    <link rel="stylesheet" href="assets/css/style2.css">
</head>
<body>
    <!-- Unified Header and Welcome Section -->
    <section id="welcome">
        <!-- Navigation Menu -->
        <header>
            <nav>
                <ul id="menu">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Morocco</a></li>
                    <li><a href="#">Portugal</a></li>
                    <li><a href="#">The Island</a></li>
                    <li><a href="#">Epic Journal</a></li>
                    <li><a href="#">Plan My Trip</a></li>
                </ul>
            </nav>
        </header>

        <!-- Epic Spirit Content -->
        <div class="content">
            <h1>Epic Spirit</h1>
            <p>Discover the world's most amazing places with us. Your adventure starts here.</p>
            
        </div>

        <!-- Background Image -->
        <div class="epic-background">
            <img src="./assets/img/epic.background.jpg" alt="Epic Spirit Background" />
        </div>
    </section>

    <!-- Founded Section -->
    <section id="founded">
        <div class="founded-background">
            <img src="./assets/img/Team.Epic4.jpg" alt="Founded Background">
        </div>
        <div class="content">
            <h2>Founded</h2>
            <p>Born to be Epic</p>
        </div>
    </section>

    <!-- Reliability Section -->
    <section id="reliability">
        <div class="reliability-background">
            <img src="./assets/img/reliability.epic.avif" alt="Reliability Background">
        </div>
        <div class="content">
            <h2>Reliability</h2>
            <p>Reliability and Flair</p>
        </div>
    </section>

    <!-- Team Section -->
    <section id="team">
        <div class="team-background">
            <img src="./assets/img/team.Epic.collage.jpg" alt="Team Background">
        </div>
        <div class="content">
            <h2>Epic People</h2>
            <p> team members:</p>
        </div>
    </section>

</html>
